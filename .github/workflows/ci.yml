name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.3.4'
      - run: npm ci
      - run: pnpm --dir backend/admin install --frozen-lockfile
      - run: node --test scripts/tests/*.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: pnpm --dir backend/admin typecheck
      - name: Build admin for /admin/
        run: |
          cp backend/admin/.env.production.example backend/admin/.env.production
          pnpm --dir backend/admin build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.lock.txt
      - name: Run isolated backend tests
        working-directory: backend
        run: |
          python - <<'PY'
          import os, secrets, subprocess, sys
          env = {**os.environ, 'SECRET_KEY': secrets.token_urlsafe(32), 'DATABASE_URL': 'sqlite://'}
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], env=env, check=True)
          PY
